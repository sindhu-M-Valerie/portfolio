<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300" role="img" aria-label="Magnifying glass" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e0a8"/>
      <stop offset="0.35" stop-color="#c79a4a"/>
      <stop offset="0.65" stop-color="#7a5622"/>
      <stop offset="1" stop-color="#e2c27c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2f1a"/>
      <stop offset="0.45" stop-color="#7b5233"/>
      <stop offset="0.55" stop-color="#5a3a22"/>
      <stop offset="1" stop-color="#22140b"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f4fbff" stop-opacity="0.30"/>
      <stop offset="0.7" stop-color="#9fbfc9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5d7f8a" stop-opacity="0.30"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <!-- Soft ground shadow -->
  <ellipse cx="124" cy="288" rx="46" ry="6" fill="#000" opacity="0.18" filter="url(#soft)"/>
  <!-- Handle (tapered, turned wood) -->
  <path d="M99 184 L121 184 L117 280 Q110 292 103 280 Z" fill="url(#wood)"/>
  <path d="M103 196 L104 276" stroke="#e9c9a0" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Brass ferrule joining handle and rim -->
  <rect x="96" y="170" width="28" height="20" rx="4" fill="url(#brass)" stroke="#4a3416" stroke-width="1"/>
  <rect x="96" y="176" width="28" height="3" fill="#4a3416" opacity="0.35"/>
  <!-- Glass -->
  <circle cx="110" cy="100" r="64" fill="url(#glass)"/>
  <!-- Rim -->
  <circle cx="110" cy="100" r="70" fill="none" stroke="url(#brass)" stroke-width="13"/>
  <circle cx="110" cy="100" r="77" fill="none" stroke="#4a3416" stroke-width="1.5"/>
  <circle cx="110" cy="100" r="63.5" fill="none" stroke="#3b2a10" stroke-width="1.5"/>
  <!-- Glass highlights -->
  <path d="M68 78 A46 46 0 0 1 104 52" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <circle cx="76" cy="70" r="3" fill="#fff" fill-opacity="0.7"/>
</svg>
