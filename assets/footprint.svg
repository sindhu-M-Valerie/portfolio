<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 80" width="40" height="80" role="img" aria-label="Footprint" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Ink-stamp roughness: slightly irregular edges, like a real print -->
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.9"/>
      <feGaussianBlur stdDeviation="0.15"/>
    </filter>
  </defs>
  <g fill="currentColor" filter="url(#ink)">
    <!-- Sole (ball of foot to toe) -->
    <path d="M19 1 C26 1 31 8 31 17 C31 25 27 30 25.5 36 C24.5 41 24.5 46 22 48.5 C19 51 14.5 49.5 13.5 45 C12.5 39 9 34 7.5 26 C6 15 10 1 19 1Z"/>
    <!-- Heel (separate, as in a real print) -->
    <path d="M14 58 C14 55.5 24 55.5 24 58 C25.5 63 24.5 70 19 71 C13.5 70 12.5 63 14 58Z"/>
  </g>
  <!-- Use transform="scale(-1,1)" on this symbol for the right foot -->
</svg>
